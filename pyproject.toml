[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hexane-desk"
version = "0.2.0"
description = "Lokales Recherche-Werkzeug für den hexane-Datensatz: Suche, Dokumente, Bewertung, MCP-Anbindung (Desktop und Browser)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "platformdirs>=4.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
mcp = ["mcp>=1.2"]
forensics = ["dkimpy>=1.1", "dnspython>=2.4"]
dev = ["pytest>=8", "httpx>=0.27", "dkimpy>=1.1", "dnspython>=2.4", "cryptography>=42"]

[project.urls]
Homepage = "https://github.com/DavionOL/hexane-viewer-desktop"
Issues = "https://github.com/DavionOL/hexane-viewer-desktop/issues"

[project.scripts]
hexane-desk = "hexane_desk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hexane_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
