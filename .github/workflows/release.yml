name: Release
# Baut bei jedem Tag v* ein eigenständiges Programm für Windows, macOS und Linux und hängt es an die GitHub-Release an.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,  name: linux,   desktop: ""}
          - {os: windows-latest, name: windows, desktop: "pywebview"}
          - {os: macos-latest,   name: macos,   desktop: "pywebview"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[mcp]" pyinstaller
      - if: matrix.desktop != ''
        run: pip install ${{ matrix.desktop }}
      - run: pyinstaller --noconfirm packaging/hexane-desk.spec
      - name: Archiv (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/hexane-desk -DestinationPath hexane-desk-${{ matrix.name }}.zip
      - name: Archiv (macOS/Linux)
        if: runner.os != 'Windows'
        run: tar czf hexane-desk-${{ matrix.name }}.tar.gz -C dist hexane-desk
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            hexane-desk-${{ matrix.name }}.zip
            hexane-desk-${{ matrix.name }}.tar.gz
